name: audit sources

on:
  schedule:
    - cron: '23 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit documented sources
        run: npm run audit:sources -- --output source-audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: modelcap-source-audit
          path: source-audit-report.json
          retention-days: 30
