name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 校验模型条目
        run: node skill/scripts/tools.mjs validate models/*.json
      - name: 检查新鲜度（180 天）
        run: node skill/scripts/check-fresh.mjs --max-days 180
      - name: 构建统一产物
        run: node skill/scripts/build-dist.mjs
