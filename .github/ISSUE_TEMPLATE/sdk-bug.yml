name: SDK bug
description: Report a bug in listModels, getModel, validateRequest, or normalizeError.
title: "[SDK]: "
labels:
  - sdk
  - bug
body:
  - type: dropdown
    id: api
    attributes:
      label: Affected API
      options:
        - getModel
        - listModels
        - validateRequest
        - normalizeError
        - package exports
        - other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest code sample or request payload that shows the issue.
      render: js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
