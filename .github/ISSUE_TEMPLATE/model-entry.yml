name: Model entry update
description: Add or correct an AI video model entry.
title: "[Model]: "
labels:
  - data
body:
  - type: input
    id: model_id
    attributes:
      label: Model ID
      description: The ModelCap model_id, or the proposed new model_id.
      placeholder: wan-3.0
    validations:
      required: true
  - type: input
    id: official_source
    attributes:
      label: Official source URL
      description: Link to official provider documentation, SDK, model card, API schema, or pricing page.
      placeholder: https://example.com/docs/model
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Requested change
      description: Describe the capability, limit, price, or error mapping to add or correct.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Mention uncertainty, conflicting official sources, or fields that should remain null.
